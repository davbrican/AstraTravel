server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
}
